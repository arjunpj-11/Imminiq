version: 2

updates:
  # Keep npm workspace dependencies current.
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'sub-main'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      routine-npm-updates:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'

  # Keep GitHub Actions references current too.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'sub-main'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      routine-action-updates:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(actions)'
