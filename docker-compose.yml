services:
  redis:
    image: redis:7-alpine
    container_name: imminiq_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  piston:
    image: ghcr.io/arjunpj-11/imminiq-piston:latest
    container_name: piston_api
    restart: always
    privileged: true
    ports:
      - '2000:2000'
    tmpfs:
      - /tmp:exec

volumes:
  redis_data:
